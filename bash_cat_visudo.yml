#!/usr/bin/env bash
# Semaphore (Bash template) - อ่านสิทธิ์ sudo (visudo) บนเครื่องปลายทางผ่าน SSH
#
# Variable Group ที่ต้องผูกกับ template:
#   Secrets (ชนิด Environment variable):
#     DEPLOY_KEY      -> Key Store: Angel (ssh private key)
#     DEPLOY_KEY_PASS -> Key Store: key แบบ "Login with password" เก็บ passphrase (ถ้า key มี passphrase)
#   Environment (ไม่ลับ):
#     TARGET_RANGE (default 10.100.1.1-10.100.1.50)  รูปแบบ: 10.100.1.1-10.100.1.50 หรือ 10.100.1.1-50
#                  หรือเครื่องเดียว 10.100.1.50 หรือหลายช่วงคั่นด้วยเว้นวรรค/คอมมา
#     TARGET_USER  (default angel)
#     SHOW_FULL    (default 1) 1=พิมพ์เนื้อหา sudoers ทุกเครื่องลง log, 0=พิมพ์เฉพาะสรุป
set -u

RANGE="${TARGET_RANGE:-${TARGET_HOST:-10.100.1.1-10.100.1.50}}"
USER_SSH="${TARGET_USER:-angel}"
SHOW_FULL="${SHOW_FULL:-1}"
OUT_DIR="./server_logs"
mkdir -p "$OUT_DIR"

WORK="$(mktemp -d)"
KEY_FILE="$WORK/key"
cleanup() {
  [ -n "${SSH_AGENT_PID:-}" ] && ssh-agent -k >/dev/null 2>&1
  rm -rf "$WORK"
}
trap cleanup EXIT
chmod 700 "$WORK"

# ---------- 1) เตรียม private key ----------
if [ -z "${DEPLOY_KEY:-}" ]; then
  echo "[ERROR] ไม่พบตัวแปร DEPLOY_KEY (ผูก Variable Group ที่มี secret ชื่อ DEPLOY_KEY หรือยัง?)"
  exit 1
fi

if [ -f "$DEPLOY_KEY" ]; then
  # Semaphore ส่งมาเป็น path ของไฟล์
  cp "$DEPLOY_KEY" "$KEY_FILE"
else
  # ส่งมาเป็นเนื้อหา key (อาจถูกยุบเป็นบรรทัดเดียว / มี \n ตัวอักษร / CRLF / เครื่องหมายคำพูด)
  # -> ดึงหัว-ท้ายออกมา แล้วประกอบ key ใหม่ให้ถูกรูปแบบ
  RAW="$DEPLOY_KEY"
  RAW="${RAW//\\n/ }"
  RAW="${RAW//$'\r'/ }"
  RAW="${RAW//$'\n'/ }"
  KEY_HEAD="$(printf '%s' "$RAW" | grep -o -E -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' | head -1)"
  KEY_FOOT="$(printf '%s' "$RAW" | grep -o -E -e '-----END [A-Z ]*PRIVATE KEY-----' | head -1)"
  if [ -z "$KEY_HEAD" ] || [ -z "$KEY_FOOT" ]; then
    echo "[ERROR] DEPLOY_KEY ไม่มีส่วน -----BEGIN/END ... PRIVATE KEY----- (วาง key ไม่ครบ?)"
    exit 1
  fi
  RAW="${RAW//$KEY_HEAD/}"
  RAW="${RAW//$KEY_FOOT/}"
  KEY_BODY="$(printf '%s' "$RAW" | tr -d ' "')"
  {
    printf '%s\n' "$KEY_HEAD"
    printf '%s' "$KEY_BODY" | fold -w 70
    printf '\n%s\n' "$KEY_FOOT"
  } > "$KEY_FILE"
fi
sed -i 's/\r$//' "$KEY_FILE"
[ -n "$(tail -c1 "$KEY_FILE")" ] && echo >> "$KEY_FILE"   # ต้องมี newline ท้ายไฟล์
chmod 600 "$KEY_FILE"

# ---------- 2) ปลดล็อก passphrase (ถ้ามี) ----------
PASS="${DEPLOY_KEY_PASS:-}"
[ -n "$PASS" ] && [ -f "$PASS" ] && PASS="$(cat "$PASS")"   # Semaphore อาจส่งมาเป็น path ของไฟล์
case "$PASS" in
  *"PRIVATE KEY"*)
    echo "[ERROR] DEPLOY_KEY_PASS เป็น private key ไม่ใช่ passphrase"
    echo "        ให้สร้าง key แบบ 'Login with password' ใน Key Store แล้วให้ DEPLOY_KEY_PASS ชี้ไปที่ key นั้น"
    exit 1 ;;
esac
if ! ssh-keygen -y -P "$PASS" -f "$KEY_FILE" >/dev/null 2>&1; then
  echo "[ERROR] อ่าน key ไม่ได้: format ผิด หรือ passphrase ไม่ถูกต้อง"
  exit 1
fi

eval "$(ssh-agent -s)" >/dev/null
if [ -n "$PASS" ]; then
  printf '#!/bin/sh\nprintf "%%s" "$KEY_PASS_ENV"\n' > "$WORK/askpass.sh"
  chmod 700 "$WORK/askpass.sh"
  KEY_PASS_ENV="$PASS" SSH_ASKPASS="$WORK/askpass.sh" SSH_ASKPASS_REQUIRE=force DISPLAY=none \
    ssh-add "$KEY_FILE" </dev/null >/dev/null 2>&1
else
  ssh-add "$KEY_FILE" </dev/null >/dev/null 2>&1
fi
if ! ssh-add -l >/dev/null 2>&1; then
  echo "[ERROR] ssh-add ไม่สำเร็จ (ตรวจ ssh -V ต้องเป็น OpenSSH 8.4+ ถ้ามี passphrase)"
  exit 1
fi
rm -f "$KEY_FILE" "$WORK/askpass.sh"   # key อยู่ใน agent แล้ว ลบไฟล์ทิ้ง

# ---------- 3) SSH ----------
SSH_OPTS=(-o BatchMode=yes
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
  -o LogLevel=ERROR
  -o ConnectTimeout=5
  -o PreferredAuthentications=publickey)
# รองรับเครื่องเก่า (OpenSSH 5.3 รองรับแค่ ssh-rsa) -- ตัวเลือกแบบ "+" จึงไม่กระทบเครื่องใหม่
SSH_OPTS+=(-o PubkeyAcceptedAlgorithms=+ssh-rsa
  -o HostKeyAlgorithms=+ssh-rsa
  -o KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1)

# ---------- 4) แปลง range เป็นรายการ IP ----------
expand_range() {
  local item prefix s e i
  for item in ${1//,/ }; do
    if [[ "$item" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)-([0-9]+\.[0-9]+\.[0-9]+\.)?([0-9]+)$ ]]; then
      prefix="${BASH_REMATCH[1]}"; s="${BASH_REMATCH[2]}"; e="${BASH_REMATCH[4]}"
      if [ -n "${BASH_REMATCH[3]}" ] && [ "${BASH_REMATCH[3]}" != "${prefix}." ]; then
        echo "[ERROR] range ข้าม subnet ไม่รองรับ: $item (ต้องอยู่ใน /24 เดียวกัน)" >&2; return 1
      fi
      if [ "$s" -gt "$e" ] || [ "$e" -gt 255 ]; then echo "[ERROR] range ไม่ถูกต้อง: $item" >&2; return 1; fi
      for ((i=s; i<=e; i++)); do echo "${prefix}.${i}"; done
    elif [[ "$item" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
      echo "$item"
    else
      echo "[ERROR] รูปแบบ range ไม่ถูกต้อง: $item" >&2; return 1
    fi
  done
}

HOSTS="$(expand_range "$RANGE")" || exit 1
TOTAL=$(echo "$HOSTS" | wc -l)

run_remote() {   # $1=host $2=คำสั่งบน remote $3=ไฟล์ผลลัพธ์
  ssh "${SSH_OPTS[@]}" "${USER_SSH}@$1" "$2" > "$3" 2> "$3.err"
}

report() {   # $1=host $2=ชื่อรายการ $3=คำสั่ง $4=ไฟล์ผลลัพธ์
  if run_remote "$1" "$3" "$4"; then
    if [ "$SHOW_FULL" = "1" ]; then
      echo "------ $2 ------"
      if [ -s "$4" ]; then cat "$4"; else echo "(ว่าง / ไม่มีข้อมูล)"; fi
    fi
    echo "[OK] $2 ($(wc -l < "$4") บรรทัด)"
    return 0
  else
    echo "[FAILED] $2"
    sed 's/^/    /' "$4.err"
    return 1
  fi
}

check_host() {   # คืนค่า 0=ok, 1=ssh/sudo มีปัญหา, 2=เชื่อมต่อไม่ได้
  local h="$1" d="$OUT_DIR/$1"
  mkdir -p "$d"
  # ทดสอบ port 22 ก่อน เพื่อไม่เสียเวลากับเครื่องที่ไม่มีอยู่
  if ! (timeout 3 bash -c "</dev/tcp/${h}/22") 2>/dev/null; then
    echo "[SKIP] port 22 ปิด/ไม่ตอบสนอง"; return 2
  fi
  if ! ssh "${SSH_OPTS[@]}" "${USER_SSH}@${h}" "echo ok" >/dev/null 2>"$WORK/conn.err"; then
    echo "[FAILED] SSH login ไม่สำเร็จ:"
    sed 's/^/    /' "$WORK/conn.err" | head -5
    return 1
  fi
  echo "SSH login ... [OK]"
  local rc=0
  report "$h" "sudo -l (สิทธิ์ของ ${USER_SSH})" "sudo -n -l" "$d/sudo_l.txt" || rc=1
  report "$h" "/etc/sudoers" "sudo -n cat /etc/sudoers" "$d/sudoers.txt" || rc=1
  report "$h" "/etc/sudoers.d/*" "sudo -n sh -c 'for f in /etc/sudoers.d/*; do [ -f \"\$f\" ] && { echo \"### \$f\"; cat \"\$f\"; }; done; true'" "$d/sudoers_d.txt" || rc=1
  report "$h" "visudo -c" "sudo -n visudo -c" "$d/visudo_check.txt" || rc=1
  report "$h" "id ${USER_SSH}" "id ${USER_SSH}" "$d/id.txt" || rc=1
  return $rc
}

OK_LIST=(); FAIL_LIST=(); SKIP_COUNT=0; n=0
echo "เป้าหมาย: $RANGE ($TOTAL เครื่อง) user: $USER_SSH"
for h in $HOSTS; do
  n=$((n+1))
  echo
  echo "=================== [$n/$TOTAL] $h ==================="
  check_host "$h"; rc=$?
  case $rc in
    0) OK_LIST+=("$h") ;;
    2) SKIP_COUNT=$((SKIP_COUNT+1)) ;;
    *) FAIL_LIST+=("$h") ;;
  esac
done

echo
echo "=================== สรุปผล ==================="
echo "ทั้งหมด: $TOTAL | สำเร็จ: ${#OK_LIST[@]} | มีปัญหา: ${#FAIL_LIST[@]} | ข้าม (port 22 ปิด): $SKIP_COUNT"
[ ${#OK_LIST[@]} -gt 0 ]   && echo "สำเร็จ: ${OK_LIST[*]}"
[ ${#FAIL_LIST[@]} -gt 0 ] && echo "มีปัญหา: ${FAIL_LIST[*]}"
echo "ไฟล์ผลลัพธ์: $OUT_DIR/<ip>/"
# ล้มเหลวก็ต่อเมื่อไม่มีเครื่องไหนสำเร็จเลย
[ ${#OK_LIST[@]} -gt 0 ] || exit 1
