#!/usr/bin/env bash
set -u

HOST="10.100.1.50"
USER_SSH="angel"
OUT_DIR="./server_logs"
mkdir -p "$OUT_DIR"

# --- เตรียม key ---
KEY_FILE="$(mktemp)"
trap 'rm -f "$KEY_FILE"' EXIT
chmod 600 "$KEY_FILE"

# แปลง \n ที่เป็นตัวอักษร -> newline จริง, ลบ \r, ลบเครื่องหมายคำพูดหัวท้าย
printf '%s' "$DEPLOY_KEY" \
  | sed -e 's/\\n/\n/g' -e 's/\r$//' -e 's/^"//' -e 's/"$//' > "$KEY_FILE"
# บังคับให้มี newline ปิดท้ายไฟล์ (สำคัญ ไม่งั้น libcrypto error)
[ -n "$(tail -c1 "$KEY_FILE")" ] && echo >> "$KEY_FILE"

# ตรวจ key ก่อนใช้ ถ้าเสียจะหยุดทันทีพร้อมบอกสาเหตุ
if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
  echo "[ERROR] DEPLOY_KEY อ่านไม่ได้ (format ผิด หรือมี passphrase)"
  exit 1
fi

SSH_OPTS=(-i "$KEY_FILE"
  -o IdentitiesOnly=yes
  -o BatchMode=yes
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
  -o PubkeyAcceptedAlgorithms=+ssh-rsa
  -o HostKeyAlgorithms=+ssh-rsa
  -o ConnectTimeout=10)

run_remote() {   # $1=คำสั่ง  $2=ไฟล์ output
  ssh "${SSH_OPTS[@]}" "${USER_SSH}@${HOST}" "$1" > "$2"
}

echo "Connecting to $HOST as $USER_SSH..."

run_remote "sudo -n cat /etc/sudoers" "$OUT_DIR/${HOST}_sudoers.txt" \
  && echo "Reading /etc/sudoers ... [OK]" \
  || echo "Reading /etc/sudoers ... [FAILED] Check sudo permission (NOPASSWD)"

run_remote "cat /etc/passwd" "$OUT_DIR/${HOST}_passwd.txt" \
  && echo "Reading /etc/passwd ... [OK]" \
  || echo "Reading /etc/passwd ... [FAILED] Connection error"
