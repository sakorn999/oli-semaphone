#!/bin/bash

# ==========================================
# Configuration Settings
# ==========================================
# รับค่า SSH Key จาก Semaphore UI (ผ่าน Secret/Extra variables)
# หาก Semaphore ส่งเข้ามาเป็น Base64 หรือ String ปกติ Script จะจัดการสร้าง Temp File ให้
SSH_KEY_CONTENT="${DEPLOY_KEY}"

# กำหนด SSH User
SSH_USER="your_ssh_user"

# ช่วง IP Target
IP_PREFIX="10.100.1"
START_IP=1
END_IP=254

# โฟลเดอร์สำหรับเก็บ Output
OUTPUT_DIR="./visudo_logs"
mkdir -p "$OUTPUT_DIR"

# ==========================================
# SSH Key Management (Temporary File)
# ==========================================
# สร้างไฟล์ชั่วคราวปลอดภัยสำหรับเก็บ Private Key
TEMP_KEY_FILE=$(mktemp)
chmod 600 "$TEMP_KEY_FILE"

# ตรวจสอบว่า SSH Key มีการขึ้นต้นด้วย -----BEGIN หรือไม่
if [[ "$SSH_KEY_CONTENT" == *"BEGIN"* ]]; then
    echo "$SSH_KEY_CONTENT" > "$TEMP_KEY_FILE"
else
    # หากตั้งค่าแบบ Encode Base64 ไว้ใน Semaphore
    echo "$SSH_KEY_CONTENT" | base64 -d > "$TEMP_KEY_FILE" 2>/dev/null || echo "$SSH_KEY_CONTENT" > "$TEMP_KEY_FILE"
fi

# ลบไฟล์ Key ชั่วคราวเมื่อ Script ทำงานจบ (ทั้งแบบปกติ หรือโดนยกเลิก)
trap 'rm -f "$TEMP_KEY_FILE"' EXIT

# ตัวเลือก SSH Option
SSH_OPTIONS="-o StrictHostKeyChecking=no -o ConnectTimeout=3 -o BatchMode=yes"

echo "=================================================="
echo "Starting visudo extraction from ${IP_PREFIX}.${START_IP} to ${IP_PREFIX}.${END_IP}"
echo "=================================================="

# ==========================================
# Execution Loop
# ==========================================
for i in $(seq $START_IP $END_IP); do
    TARGET_IP="${IP_PREFIX}.${i}"
    OUTPUT_FILE="${OUTPUT_DIR}/${TARGET_IP}.txt"
    
    echo -n "Connecting to ${TARGET_IP} ... "
    
    # รัน SSH โดยระบุ Identity File เป็น Temp Key
    # ใช้ sudo -n (non-interactive) เพื่ออ่าน /etc/sudoers
    ssh $SSH_OPTIONS -i "$TEMP_KEY_FILE" "${SSH_USER}@${TARGET_IP}" "sudo -n cat /etc/sudoers" > "$OUTPUT_FILE" 2>&1
    
    if [ $? -eq 0 ]; then
        echo "[SUCCESS] Saved to ${OUTPUT_FILE}"
    else
        echo "[FAILED] Connection error or sudo permission denied"
        mv "$OUTPUT_FILE" "${OUTPUT_FILE}.error"
    fi
done

echo "=================================================="
echo "Task completed. Results saved in ${OUTPUT_DIR}"
echo "=================================================="
