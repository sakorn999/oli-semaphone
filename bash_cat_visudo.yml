---
- name: Run Native Bash Script from Semaphore Runner
  hosts: all
  connection: local
  gather_facts: no

  tasks:
    - name: Execute Bash script on target servers via direct SSH
      ansible.builtin.shell: |
        # 1. สร้าง SSH Key ชั่วคราวจาก Variable Group
        TMP_KEY=$(mktemp)
        echo "$DEPLOY_KEY" > "$TMP_KEY"
        chmod 600 "$TMP_KEY"
        trap 'rm -f "$TMP_KEY"' EXIT

        # 2. ดึง IP จากไฟล์ Inventory ของ Semaphore
        INVENTORY_FILE="$SEMAPHORE_INVENTORY_FILE"
        
        if [ -z "$INVENTORY_FILE" ] || [ ! -f "$INVENTORY_FILE" ]; then
            echo "[ERROR] Inventory file not found: $INVENTORY_FILE"
            exit 1
        fi

        # ดึงเฉพาะ IP Address ออกจาก Inventory
        HOSTS=$(grep -E -o '([0-9]{1,3}\.){3}[0-9]{1,3}' "$INVENTORY_FILE" | sort -u)

        # 3. วนลูป SSH เข้าไป Query แต่ละเครื่อง
        for HOST in $HOSTS; do
            echo "=========================================="
            echo "Querying visudo on: $HOST"
            echo "=========================================="
            ssh -i "$TMP_KEY" \
                -o StrictHostKeyChecking=no \
                -o ConnectTimeout=5 \
                "root@${HOST}" \
                "sudo visudo -c && echo '--- Sudoers Rules ---' && sudo grep -v '^[[:space:]]*#' /etc/sudoers | grep -v '^[[:space:]]*$'" \
                || echo "[ERROR] Connect or Query failed on $HOST"
            echo ""
        done
      run_once: true
      register: bash_result

    - name: Display Output
      ansible.builtin.debug:
        msg: "{{ bash_result.stdout_lines }}"
      run_once: true
