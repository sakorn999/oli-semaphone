---
- name: Query visudo on target servers
  hosts: all
  gather_facts: no
  become: yes          # ใช้สิทธิ์ root/sudo ในการรัน visudo

  tasks:
    - name: Check visudo syntax and read sudoers
      ansible.builtin.shell: |
        visudo -c
        echo "=== Active Sudoers Rules ==="
        grep -v '^[[:space:]]*#' /etc/sudoers | grep -v '^[[:space:]]*$'
      register: visudo_output

    - name: Print output
      ansible.builtin.debug:
        var: visudo_output.stdout_lines
