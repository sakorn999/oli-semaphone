#!/bin/bash

# ==========================================
# Configuration Settings
# ==========================================
# รับค่า SSH Key จาก Semaphore UI (ผ่าน Secret/Extra variables)
SSH_KEY_CONTENT="${DEPLOY_KEY}"

# กำหนด SSH User เป็น angel
SSH_USER="angel"

# กำหนด Target IP
TARGET_IP="10.100.1.50"

# โฟลเดอร์สำหรับเก็บ Output
OUTPUT_DIR="./server_logs"
mkdir -p "$OUTPUT_DIR"

# ==========================================
# SSH Key Management (Temporary File)
# ==========================================
TEMP_KEY_FILE=$(mktemp)
chmod 600 "$TEMP_KEY_FILE"

if [[ "$SSH_KEY_CONTENT" == *"BEGIN"* ]]; then
    echo "$SSH_KEY_CONTENT" > "$TEMP_KEY_FILE"
else
    echo "$SSH_KEY_CONTENT" | base64 -d > "$TEMP_KEY_FILE" 2>/dev/null || echo "$SSH_KEY_CONTENT" > "$TEMP_KEY_FILE"
fi

# ลบไฟล์ Key ชั่วคราวเมื่อทำงานเสร็จ
trap 'rm -f "$TEMP_KEY_FILE"' EXIT

# ==========================================
# SSH Options
# ==========================================
SSH_OPTIONS="-o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=yes -o HostKeyAlgorithms=ssh-rsa,ssh-dss -o PubkeyAcceptedKeyTypes=ssh-rsa,ssh-dss"

# ==========================================
# Execution
# ==========================================
SUDOERS_FILE="${OUTPUT_DIR}/${TARGET_IP}_sudoers.txt"
PASSWD_FILE="${OUTPUT_DIR}/${TARGET_IP}_passwd.txt"

echo "=================================================="
echo "Connecting to ${TARGET_IP} as user ${SSH_USER}..."
echo "=================================================="

# 1. อ่านไฟล์ /etc/sudoers
echo -n "Reading /etc/sudoers ... "
ssh $SSH_OPTIONS -i "$TEMP_KEY_FILE" "${SSH_USER}@${TARGET_IP}" "sudo -n cat /etc/sudoers" > "$SUDOERS_FILE" 2>&1
if [ $? -eq 0 ]; then
    echo "[SUCCESS]"
else
    echo "[FAILED] Check sudo permission"
fi

# 2. อ่านไฟล์ /etc/passwd
echo -n "Reading /etc/passwd ... "
ssh $SSH_OPTIONS -i "$TEMP_KEY_FILE" "${SSH_USER}@${TARGET_IP}" "cat /etc/passwd" > "$PASSWD_FILE" 2>&1
if [ $? -eq 0 ]; then
    echo "[SUCCESS]"
else
    echo "[FAILED] Connection error"
fi

# ==========================================
# Display Results on Console / Log
# ==========================================
echo ""
echo "=================== /etc/sudoers ==================="
cat "$SUDOERS_FILE"

echo ""
echo "=================== /etc/passwd ===================="
cat "$PASSWD_FILE"

echo "===================================================="
