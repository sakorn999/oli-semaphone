#!/bin/bash

# สคริปต์สำหรับตรวจสอบและแสดงข้อมูล Hostname ของเครื่อง Linux

echo "=== System Hostname Audit Report ==="
echo "Timestamp    : $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
echo "Hostname     : $(hostname)"
echo "Pretty Name  : $(hostnamectl status 2>/dev/null | grep 'Static hostname' | awk -F': ' '{print $2}' || echo $(hostname))"
echo "IP Address   : $(hostname -I 2>/dev/null | awk '{print $1}' || echo 'N/A')"
echo "===================================="
